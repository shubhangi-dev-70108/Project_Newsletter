<!DOCTYPE html>
<html>

<head>
    <script src="./index.js" defer></script>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <div class="newsletter-container">
        <button class="openPopup">Get Newsletter</button>
        <div class="image2"><img src="./clarity_cursor-hand-click-line.jpg" alt="image2"></div>
    </div>
    <div class="popup-container">
        <div class="overlay"></div>
        <div class="popup">
            <div class="content">
                <div class="close-icon">&times</div>
                <div class="image1"><img src="./Group 1.jpg" alt="image1"></div>
                <div class="text">
                    <h2>Don’t miss out.</h2>
                    <p>Sign up for our newsletter to stay in the loop.</p>
                </div>
            </div>
            <button class="btn">
                <span class="right">Email Address</span>
                <span class="left">Subscribe</span>
            </button>
        </div>
    </div>
    <footer>Made with by ❤️ Shubhangi Sharma</footer>
